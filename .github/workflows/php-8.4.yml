name: PHP 8.4 pipeline

# Entry point for the PHP 8.4 chain. Triggered by workflow_dispatch — either
# manually, or by rpmbuild-php-8.4's `notify` job (createWorkflowDispatch) once
# its base phase (RPMs + aursu/php85build:<os>-build) is published. Delegates the
# ordered family rebuild + runtime/dev image build to the reusable rebuild-php.yml.
# (workflow_dispatch, not repository_dispatch: the orchestrator App is
# Actions:write but Contents:read-only, and repository_dispatch needs Contents:write.)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build in each target repo; empty -> each repo's default branch
        default: ''
        type: string

concurrency:
  group: php-8.4-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/rebuild-php.yml
    with:
      php: "8.4"
      ref: ${{ inputs.ref }}
    secrets: inherit
